[project]
name = "twitch-scout"
version = "0.1.0"
description = "Pick the next Twitch category to stream, from data sampled at the hours that matter."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "tzdata>=2024.1",  # ships the IANA tz database; zoneinfo has no source on Windows
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
scout = "twitch_scout.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["twitch_scout*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RET", "PLR"]

[tool.ruff.lint.per-file-ignores]
# Literal expected values are the whole point of an assertion; test mock routers
# legitimately branch into many returns.
"tests/*" = ["PLR2004", "PLR0911"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
