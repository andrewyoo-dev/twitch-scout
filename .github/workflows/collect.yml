name: collect

# Sampling tiers are decided in Python from a Pacific-time clock (see
# twitch_scout/collect/tiers.py), so these crons only need to fire often enough to
# cover the possibilities; the collector picks window vs baseline and skips slots it
# has already sampled. Times are UTC.
#
# GitHub drops/delays scheduled runs under load, and the top of the hour (:00) is the
# most congested slot, so both crons are offset off :00 and kept modest — 10-minute
# window sampling was finer than needed (handoff open questions). The idempotent slot
# design absorbs whatever GitHub skips.
#
#   - hourly baseline at :23
#   - every 20 min (offset) during the UTC hours that can hold a 18:30-22:30 PT
#     window on a Tue/Thu/Sat. PT evening lands on Wed/Fri/Sun in UTC (dow 3,5,0);
#     PDT is 01:30-05:30 UTC and PST is 02:30-06:30 UTC, so hours 1-6 cover both.
on:
  schedule:
    - cron: "23 * * * *"
    - cron: "7,27,47 1-6 * * 3,5,0"
  workflow_dispatch: {}

# Never let two samples run at once; queue the next instead of overlapping writes.
concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install
        run: pip install -e ".[turso]"

      - name: Collect
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          # SCOUT_DB must be the Turso libSQL URL once store/db.py grows Turso
          # support. Until it is set, scheduled runs are green no-ops rather than
          # writing to an ephemeral runner disk that is thrown away.
          SCOUT_DB: ${{ secrets.SCOUT_DB }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          if [ -z "$SCOUT_DB" ]; then
            echo "SCOUT_DB not configured yet (Turso pending); skipping collection."
            exit 0
          fi
          scout init-db
          scout collect --tier auto
