name: collect

# Runs one collection sample. Triggered externally every ~15 min via
# workflow_dispatch (a cron-job.org job calling the GitHub API). GitHub's own
# `schedule` events are best-effort and were dropping the decision-grade window
# samples, so scheduling lives outside GitHub. The collector decides window vs
# baseline from a Pacific-time clock and skips already-sampled slots, so a fixed
# trigger cadence is safe and cheap. See HANDOFF_COLLECTION_RELIABILITY.md.
on:
  workflow_dispatch: {}

# Never let two samples run at once; queue the next instead of overlapping writes.
concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install
        run: pip install -e ".[turso]"

      - name: Collect
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          # SCOUT_DB is the Turso libSQL URL (repo secret). The guard below keeps a
          # run a green no-op if the secret is somehow unset, rather than writing to
          # the runner's ephemeral disk.
          SCOUT_DB: ${{ secrets.SCOUT_DB }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          if [ -z "$SCOUT_DB" ]; then
            echo "SCOUT_DB not configured yet (Turso pending); skipping collection."
            exit 0
          fi
          scout init-db
          scout collect --tier auto
